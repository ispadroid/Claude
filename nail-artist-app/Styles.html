<style>
/* =====================================================================
   Styles.html — Mobile-first CSS for Mary Jo Nails app
   Optimized for iPhone Safari. No external dependencies.
   ===================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:    #c0392b;
  --accent-dk: #922b21;
  --accent-lt: #f9e5e4;
  --green:     #27ae60;
  --orange:    #e67e22;
  --blue:      #2980b9;
  --gray-lt:   #f4f4f5;
  --gray:      #9ca3af;
  --gray-dk:   #4b5563;
  --text:      #1f2937;
  --white:     #ffffff;
  --radius:    12px;
  --shadow:    0 2px 12px rgba(0,0,0,0.10);
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.08);
}

html { font-size: 16px; -webkit-text-size-adjust: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #f0f0f2;
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior: none;
}

/* =====================================================================
   Page shell
   ===================================================================== */
.app-shell {
  max-width: 600px;
  margin: 0 auto;
  min-height: 100vh;
  background: #f0f0f2;
}

.page { display: none; min-height: 100vh; }
.page.active { display: block; }

/* =====================================================================
   Top bar
   ===================================================================== */
.topbar {
  background: var(--accent);
  color: var(--white);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.topbar-title { font-size: 17px; font-weight: 700; letter-spacing: 0.2px; }
.topbar-back {
  background: none; border: none; color: var(--white);
  font-size: 22px; cursor: pointer; padding: 4px 8px; margin-left: -8px;
  line-height: 1;
}
.topbar-action {
  background: rgba(255,255,255,0.2); border: none; color: var(--white);
  font-size: 13px; padding: 6px 12px; border-radius: 20px; cursor: pointer;
}

/* =====================================================================
   Content container
   ===================================================================== */
.content { padding: 16px; }

/* =====================================================================
   Cards
   ===================================================================== */
.card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.card-title { font-size: 13px; color: var(--gray-dk); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.card-value { font-size: 28px; font-weight: 700; color: var(--text); }
.card-value.green { color: var(--green); }
.card-value.red { color: var(--accent); }
.card-value.orange { color: var(--orange); }
.card-value.blue { color: var(--blue); }
.card-sub { font-size: 13px; color: var(--gray); margin-top: 2px; }

/* =====================================================================
   Grid layouts
   ===================================================================== */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }

/* =====================================================================
   Buttons
   ===================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 14px 20px; border-radius: var(--radius);
  font-size: 16px; font-weight: 600; border: none; cursor: pointer;
  text-decoration: none; transition: opacity 0.15s, transform 0.1s;
  width: 100%; margin-bottom: 10px; -webkit-tap-highlight-color: transparent;
}
.btn:active { opacity: 0.8; transform: scale(0.98); }
.btn-primary { background: var(--accent); color: var(--white); }
.btn-success { background: var(--green); color: var(--white); }
.btn-outline { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
.btn-gray { background: var(--gray-lt); color: var(--gray-dk); }
.btn-blue { background: var(--blue); color: var(--white); }
.btn-orange { background: var(--orange); color: var(--white); }
.btn-sm { padding: 8px 14px; font-size: 14px; margin-bottom: 0; }
.btn-icon { font-size: 20px; padding: 8px; width: auto; border-radius: 50%; }
.btn-danger { background: #fee2e2; color: #dc2626; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* =====================================================================
   Quick action grid (dashboard)
   ===================================================================== */
.quick-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.quick-btn {
  background: var(--white);
  border: none;
  border-radius: var(--radius);
  padding: 20px 12px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.1s, box-shadow 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.quick-btn:active { transform: scale(0.96); box-shadow: none; }
.quick-btn-icon { font-size: 32px; display: block; margin-bottom: 6px; }
.quick-btn-label { font-size: 14px; font-weight: 600; color: var(--text); display: block; }
.quick-btn.accent { background: var(--accent); }
.quick-btn.accent .quick-btn-label { color: var(--white); }
.quick-btn.green { background: var(--green); }
.quick-btn.green .quick-btn-label { color: var(--white); }

/* =====================================================================
   Forms
   ===================================================================== */
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 14px; font-weight: 600; color: var(--gray-dk); margin-bottom: 6px; }
input, select, textarea {
  width: 100%; padding: 14px; border: 1.5px solid #e5e7eb;
  border-radius: 10px; font-size: 16px; color: var(--text);
  background: var(--white); appearance: none; -webkit-appearance: none;
  transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
}
textarea { min-height: 80px; resize: vertical; }
.input-row { display: flex; gap: 8px; }
.input-row > * { flex: 1; }

/* =====================================================================
   PIN pad
   ===================================================================== */
.pin-display {
  display: flex; justify-content: center; gap: 12px; margin: 24px 0;
}
.pin-dot {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--accent); background: transparent;
  transition: background 0.15s;
}
.pin-dot.filled { background: var(--accent); }
.pin-pad {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  max-width: 280px; margin: 0 auto;
}
.pin-key {
  aspect-ratio: 1; background: var(--white); border: none;
  border-radius: 50%; font-size: 24px; font-weight: 500;
  cursor: pointer; box-shadow: var(--shadow-sm);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s;
}
.pin-key:active { background: var(--accent); color: var(--white); }
.pin-key.del { font-size: 20px; color: var(--gray-dk); }

/* =====================================================================
   Section headers
   ===================================================================== */
.section-header {
  font-size: 13px; font-weight: 700; color: var(--gray);
  text-transform: uppercase; letter-spacing: 0.8px;
  padding: 16px 0 8px;
}

/* =====================================================================
   Lists / rows
   ===================================================================== */
.list-item {
  background: var(--white); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 8px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow-sm); cursor: pointer;
  transition: transform 0.1s;
}
.list-item:active { transform: scale(0.99); }
.list-item-left { flex: 1; min-width: 0; }
.list-item-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item-sub { font-size: 13px; color: var(--gray); margin-top: 2px; }
.list-item-right { text-align: right; margin-left: 12px; flex-shrink: 0; }
.list-item-amount { font-size: 16px; font-weight: 700; }

/* =====================================================================
   Badges / pills
   ===================================================================== */
.badge {
  display: inline-block; padding: 3px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
}
.badge-green { background: #dcfce7; color: #15803d; }
.badge-orange { background: #fef3c7; color: #92400e; }
.badge-red { background: #fee2e2; color: #dc2626; }
.badge-gray { background: var(--gray-lt); color: var(--gray-dk); }
.badge-blue { background: #dbeafe; color: #1e40af; }

/* =====================================================================
   Warning banner
   ===================================================================== */
.warning-banner {
  background: #fef3c7; border-left: 4px solid #f59e0b;
  padding: 12px 14px; border-radius: 0 8px 8px 0; margin-bottom: 12px; font-size: 14px;
}

/* =====================================================================
   Modal / overlay
   ===================================================================== */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 200; align-items: flex-end; justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--white); border-radius: 20px 20px 0 0;
  width: 100%; max-width: 600px; padding: 24px 20px;
  max-height: 90vh; overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.modal-close {
  position: absolute; top: 16px; right: 20px;
  background: var(--gray-lt); border: none; border-radius: 50%;
  width: 32px; height: 32px; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* =====================================================================
   Toast notifications
   ===================================================================== */
.toast-container {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  z-index: 300; width: calc(100% - 32px); max-width: 360px;
}
.toast {
  background: #1f2937; color: var(--white); padding: 14px 18px;
  border-radius: 12px; font-size: 14px; margin-top: 8px;
  animation: toastIn 0.25s ease; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.toast.success { background: var(--green); }
.toast.error { background: var(--accent); }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* =====================================================================
   Loading spinner
   ===================================================================== */
.spinner-overlay {
  display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.7);
  z-index: 400; align-items: center; justify-content: center;
}
.spinner-overlay.active { display: flex; }
.spinner {
  width: 48px; height: 48px; border: 4px solid #f3f3f3;
  border-top: 4px solid var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* =====================================================================
   Sale item row (in new sale form)
   ===================================================================== */
.sale-item-card {
  background: var(--gray-lt); border-radius: 10px; padding: 12px; margin-bottom: 10px;
}
.sale-item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sale-item-title { font-weight: 600; font-size: 15px; }

/* =====================================================================
   Summary row
   ===================================================================== */
.summary-row {
  display: flex; justify-content: space-between; padding: 8px 0;
  border-bottom: 1px solid #f3f3f3; font-size: 15px;
}
.summary-row.total { font-weight: 700; font-size: 17px; border-bottom: none; border-top: 2px solid var(--text); padding-top: 10px; }

/* =====================================================================
   Month table
   ===================================================================== */
.month-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.month-table th { background: var(--gray-lt); padding: 8px; text-align: left; font-size: 11px; text-transform: uppercase; }
.month-table td { padding: 8px; border-bottom: 1px solid #f3f3f3; }
.month-table tr:last-child td { border-bottom: none; }

/* =====================================================================
   Login screen special styles
   ===================================================================== */
.login-logo {
  text-align: center; padding: 48px 20px 24px;
}
.login-logo-emoji { font-size: 64px; display: block; margin-bottom: 8px; }
.login-logo-title { font-size: 28px; font-weight: 800; color: var(--accent); }
.login-logo-sub { font-size: 15px; color: var(--gray); margin-top: 4px; }
.login-card { background: var(--white); border-radius: 20px 20px 0 0; padding: 28px 24px; min-height: 60vh; }

/* =====================================================================
   Chart bar (simple CSS bar chart)
   ===================================================================== */
.bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 80px; margin-bottom: 4px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
.bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 2px; transition: height 0.3s; }
.bar.revenue { background: var(--green); }
.bar.expense { background: var(--accent); }
.bar-label { font-size: 9px; color: var(--gray); margin-top: 2px; }

/* =====================================================================
   Misc
   ===================================================================== */
.text-center { text-align: center; }
.text-muted { color: var(--gray); font-size: 14px; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mb-0 { margin-bottom: 0 !important; }
.divider { border: none; border-top: 1px solid #f3f3f3; margin: 16px 0; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--gray); }
.empty-state-icon { font-size: 48px; margin-bottom: 12px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip {
  padding: 6px 14px; border-radius: 20px; font-size: 13px;
  border: 1.5px solid #e5e7eb; background: var(--white); cursor: pointer;
  transition: all 0.1s;
}
.chip.selected { background: var(--accent); color: var(--white); border-color: var(--accent); }
.help-text { font-size: 12px; color: var(--gray); margin-top: 4px; }
</style>
